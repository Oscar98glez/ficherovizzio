name: Configurar enlaces de los correos de Supabase

# Los correos de Supabase (cambiar la contraseña, confirmar la cuenta) llevan a la "Site URL" de
# Supabase, o a la dirección de la app si está en la lista de "Redirect URLs". Si no está bien puesta,
# el enlace lleva a http://localhost:3000 y no abre.
#
# Esta acción pone la Site URL en la dirección de la app (APP_URL) y añade a las Redirect URLs la app y
# sus despliegues de Vercel, sin quitar las que ya hubiera. Usa los secretos SUPABASE_ACCESS_TOKEN y
# SUPABASE_PROJECT_REF. En cualquier otra rama que no sea main sólo muestra lo que hay y lo que cambiaría.
on:
  push:
    branches: [main, 'claude/**']
    paths: ['.github/workflows/supabase-auth-urls.yml']
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Guardar los cambios en Supabase (si no, sólo se muestra qué cambiaría)'
        type: boolean
        default: false

jobs:
  auth-urls:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Dirección con la que se abre la app (variable del repositorio APP_URL; si no, la de Vercel)
      APP_URL: ${{ vars.APP_URL || 'https://ficherovizzio.vercel.app' }}
      # Despliegues de Vercel de este proyecto (sólo los de la cuenta oscar98glez)
      EXTRA_URLS: 'https://ficherovizzio-*-oscar98glez.vercel.app/**'
      APLICAR: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.aplicar == true }}
    steps:
      - name: Comprobar y corregir
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Faltan los secretos SUPABASE_ACCESS_TOKEN y/o SUPABASE_PROJECT_REF."
            exit 0
          fi
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth"
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api" > actual.json
          python3 - <<'EOF'
          import json, os
          cfg = json.load(open('actual.json'))
          app = os.environ['APP_URL'].rstrip('/')
          site = (cfg.get('site_url') or '').rstrip('/')
          urls = [u.strip() for u in (cfg.get('uri_allow_list') or '').split(',') if u.strip()]
          print('Site URL actual:', site or '(vacía)')
          print('Redirect URLs actuales:', ', '.join(urls) or '(ninguna)')
          wanted = [app, app + '/**'] + os.environ['EXTRA_URLS'].split(',')
          new_urls = urls + [u for u in wanted if u not in urls]
          change = {}
          if site != app:
              change['site_url'] = app
          if new_urls != urls:
              change['uri_allow_list'] = ','.join(new_urls)
          print('Cambios:', json.dumps(change, ensure_ascii=False) if change else 'ninguno')
          json.dump(change, open('cambios.json', 'w'))
          EOF
          if [ "$APLICAR" != "true" ]; then echo "Sólo comprobación: no se guarda nada."; exit 0; fi
          if [ "$(cat cambios.json)" = "{}" ]; then echo "Ya estaba bien."; exit 0; fi
          curl -fsS -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @cambios.json "$api" > /dev/null
          echo "Guardado en Supabase."
