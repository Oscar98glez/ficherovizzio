name: Aplicar migraciones de Supabase

# Aplica en Supabase las migraciones nuevas de supabase/migrations cada vez que cambian en main.
# Usa los mismos secretos que "Publicar funciones de Supabase": SUPABASE_ACCESS_TOKEN y SUPABASE_PROJECT_REF
# (la CLI entra con un rol temporal, no hace falta la contraseña de la base de datos).
#
# En cualquier otra rama, o al lanzarla a mano sin marcar "aplicar", sólo muestra qué se aplicaría.
#
# Las migraciones anteriores a DESDE se aplicaron a mano (editor SQL) y no constan en el historial de
# Supabase: esas sólo se apuntan como aplicadas ("migration repair", no se vuelven a ejecutar).
on:
  push:
    branches: [main, 'claude/**']
    paths: ['supabase/migrations/**', '.github/workflows/apply-migrations.yml']
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Aplicar las migraciones (si no, sólo se muestra qué se aplicaría)'
        type: boolean
        default: false

concurrency:
  group: apply-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Primera migración que se aplica con esta acción: las anteriores ya están en la base de datos
      DESDE: '20261008120000'
      APLICAR: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.aplicar == true }}
    steps:
      - name: Comprobar secretos
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Faltan los secretos SUPABASE_ACCESS_TOKEN y/o SUPABASE_PROJECT_REF: no se aplica nada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ok == 'true'
        with:
          version: latest

      - name: Vincular el proyecto
        if: steps.secrets.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Migraciones en el repositorio y en Supabase
        if: steps.secrets.outputs.ok == 'true'
        run: supabase migration list --linked

      - name: Qué se aplicaría
        if: steps.secrets.outputs.ok == 'true'
        id: plan
        run: |
          supabase db push --linked --dry-run 2>&1 | tee plan.txt
          pending=$(grep -oE '[0-9]{14}_[A-Za-z0-9_.-]+\.sql' plan.txt | cut -c1-14 | sort -u || true)
          old=$(echo "$pending" | awk -v d="$DESDE" 'NF && $0 < d' | xargs)
          new=$(echo "$pending" | awk -v d="$DESDE" 'NF && $0 >= d' | xargs)
          echo "Ya aplicadas a mano (sólo se apuntan en el historial): ${old:-ninguna}"
          echo "Se aplicarán: ${new:-ninguna}"
          echo "old=$old" >> "$GITHUB_OUTPUT"

      - name: Apuntar como aplicadas las migraciones anteriores
        if: steps.secrets.outputs.ok == 'true' && env.APLICAR == 'true' && steps.plan.outputs.old != ''
        run: supabase migration repair --linked --status applied ${{ steps.plan.outputs.old }}

      - name: Aplicar
        if: steps.secrets.outputs.ok == 'true' && env.APLICAR == 'true'
        run: |
          supabase db push --linked --yes
          supabase migration list --linked
