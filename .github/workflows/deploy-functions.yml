name: Publicar funciones de Supabase

# Publica las funciones de supabase/functions (el conector de Claude) cada vez que
# cambian en main. Necesita los secretos SUPABASE_ACCESS_TOKEN y SUPABASE_PROJECT_REF.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Comprobar secretos
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Faltan los secretos SUPABASE_ACCESS_TOKEN y/o SUPABASE_PROJECT_REF: no se publica nada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ok == 'true'
        with:
          version: latest

      # Claude no envía el token de Supabase: el acceso lo controla el enlace secreto del conector
      - name: Publicar el conector de Claude (rapid-responder)
        if: steps.secrets.outputs.ok == 'true'
        run: supabase functions deploy rapid-responder --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api

      # La sesión del usuario de la app se comprueba dentro de la función
      - name: Publicar las notificaciones al móvil (notify)
        if: steps.secrets.outputs.ok == 'true'
        run: supabase functions deploy notify --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
